# Generated by gen_commands.py. Option summaries are taken verbatim from `uniq --help`
# on Debian 13.7 (English); everything else is hand-written.
id: uniq
name: uniq
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/text
level: intermediate
summary: Αφαιρεί (ή μετράει) διαδοχικές διπλές γραμμές.
description: Συγκρίνει μόνο **γειτονικές** γραμμές, γι' αυτό σχεδόν πάντα χρησιμοποιείται μετά από `sort`.
synopsis:
- uniq [OPTION]... [INPUT [OUTPUT]]
flag_grammar: gnu_getopt
options:
- flags:
  - -c
  - --count
  summary: prefix lines by the number of occurrences
- flags:
  - -d
  - --repeated
  summary: only print duplicate lines, one for each group
- flags:
  - -D
  summary: print all duplicate lines
- flags:
  - --all-repeated
  summary: like -D, but allow separating groups with an empty line; METHOD={none(default),prepend,separate}
  value: optional
  value_name: METHOD
- flags:
  - -f
  - --skip-fields
  summary: avoid comparing the first N fields
  value: required
  value_name: N
- flags:
  - --group
  summary: show all items, separating groups with an empty line; METHOD={separate(default),prepend,append,both}
  value: optional
  value_name: METHOD
- flags:
  - -i
  - --ignore-case
  summary: ignore differences in case when comparing
- flags:
  - -s
  - --skip-chars
  summary: avoid comparing the first N characters
  value: required
  value_name: N
- flags:
  - -u
  - --unique
  summary: only print unique lines
- flags:
  - -z
  - --zero-terminated
  summary: line delimiter is NUL, not newline
- flags:
  - -w
  - --check-chars
  summary: compare no more than N characters in lines
  value: required
  value_name: N
examples:
- cmd: sort ips.txt | uniq -c
  explain:
  - token: sort ips.txt
    meaning: φέρε τις ίδιες γραμμές τη μία δίπλα στην άλλη
  - token: '|'
    meaning: δώσε το output στην επόμενη εντολή
  - token: uniq -c
    meaning: μέτρησε πόσες φορές εμφανίζεται κάθε γραμμή
common_mistakes:
- wrong: uniq ips.txt
  why: Χωρίς ταξινόμηση, διπλές γραμμές που δεν είναι γειτονικές μένουν.
related:
- id: sort
- id: wc
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/uniq-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
