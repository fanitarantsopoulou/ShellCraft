# Generated by gen_commands.py. Option summaries are taken verbatim from `cat --help`
# on Debian 13.7 (English); everything else is hand-written.
id: cat
name: cat
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/text
level: beginner
summary: Τυπώνει (και ενώνει) το περιεχόμενο αρχείων.
description: 'Το όνομα έρχεται από το *concatenate*: `cat a b` τυπώνει το a και μετά το b.'
synopsis:
- cat [OPTION]... [FILE]...
flag_grammar: gnu_getopt
options:
- flags:
  - -A
  - --show-all
  summary: equivalent to -vET
- flags:
  - -b
  - --number-nonblank
  summary: number nonempty output lines, overrides -n
- flags:
  - -e
  summary: equivalent to -vE
- flags:
  - -E
  - --show-ends
  summary: display $ at end of each line
- flags:
  - -n
  - --number
  summary: number all output lines
- flags:
  - -s
  - --squeeze-blank
  summary: suppress repeated empty output lines
- flags:
  - -t
  summary: equivalent to -vT
- flags:
  - -T
  - --show-tabs
  summary: display TAB characters as ^I
- flags:
  - -u
  summary: (ignored)
- flags:
  - -v
  - --show-nonprinting
  summary: use ^ and M- notation, except for LFD and TAB
examples:
- cmd: cat notes.txt
  explain:
  - token: cat
    meaning: τύπωσε το περιεχόμενο
  - token: notes.txt
    meaning: το αρχείο
common_mistakes:
- wrong: cat bigfile.log
  why: Για μεγάλα αρχεία το `cat` γεμίζει την οθόνη — εκεί ταιριάζει `less` ή `tail`.
related:
- id: head
- id: tail
- id: wc
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/cat-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
