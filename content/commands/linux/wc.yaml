# Generated by gen_commands.py. Option summaries are taken verbatim from `wc --help`
# on Debian 13.7 (English); everything else is hand-written.
id: wc
name: wc
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/text
level: beginner
summary: Μετράει γραμμές, λέξεις και bytes.
description: 'Χωρίς επιλογές τυπώνει: γραμμές, λέξεις, bytes, όνομα αρχείου.'
synopsis:
- wc [OPTION]... [FILE]...
- wc [OPTION]... --files0-from=F
flag_grammar: gnu_getopt
options:
- flags:
  - -c
  - --bytes
  summary: print the byte counts
- flags:
  - -m
  - --chars
  summary: print the character counts
- flags:
  - -l
  - --lines
  summary: print the newline counts
- flags:
  - --files0-from
  summary: read input from the files specified by NUL-terminated names in file F; If F is - then read names from
    standard input
  value: required
  value_name: F
- flags:
  - -L
  - --max-line-length
  summary: print the maximum display width
- flags:
  - -w
  - --words
  summary: print the word counts
- flags:
  - --total
  summary: 'when to print a line with total counts; WHEN can be: auto, always, only, never'
  value: required
  value_name: WHEN
examples:
- cmd: wc -l access.log
  explain:
  - token: wc
    meaning: μέτρησε
  - token: -l
    meaning: μόνο γραμμές
  - token: access.log
    meaning: το αρχείο
common_mistakes:
- wrong: wc -c access.log
  why: Το `-c` μετράει bytes, όχι γραμμές.
related:
- id: cat
- id: grep
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/wc-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
