# Generated by gen_commands.py. Option summaries are taken verbatim from `grep --help`
# on Debian 13.7 (English); everything else is hand-written.
id: grep
name: grep
kind: external_utility
provider: GNU grep
platform: debian-13
category: linux/text
level: beginner
summary: Βρίσκει γραμμές που ταιριάζουν σε ένα μοτίβο.
description: Τυπώνει κάθε γραμμή που περιέχει το μοτίβο. Είναι case-sensitive εκτός αν δώσεις `-i`. Επιστρέφει exit
  code 1 όταν δεν βρει τίποτα.
synopsis:
- grep [OPTION]... PATTERNS [FILE]...
flag_grammar: gnu_getopt
options:
- flags:
  - -E
  - --extended-regexp
  summary: PATTERNS are extended regular expressions
- flags:
  - -F
  - --fixed-strings
  summary: PATTERNS are strings
- flags:
  - -G
  - --basic-regexp
  summary: PATTERNS are basic regular expressions
- flags:
  - -P
  - --perl-regexp
  summary: PATTERNS are Perl regular expressions
- flags:
  - -e
  - --regexp
  summary: use PATTERNS for matching
  value: required
  value_name: PATTERNS
- flags:
  - -f
  - --file
  summary: take PATTERNS from FILE
  value: required
  value_name: FILE
- flags:
  - -i
  - --ignore-case
  summary: ignore case distinctions in patterns and data
- flags:
  - --no-ignore-case
  summary: do not ignore case distinctions (default)
- flags:
  - -w
  - --word-regexp
  summary: match only whole words
- flags:
  - -x
  - --line-regexp
  summary: match only whole lines
- flags:
  - -z
  - --null-data
  summary: a data line ends in 0 byte, not newline
- flags:
  - -s
  - --no-messages
  summary: suppress error messages
- flags:
  - -v
  - --invert-match
  summary: select non-matching lines
- flags:
  - -V
  summary: display version information and exit
- flags:
  - -m
  - --max-count
  summary: stop after NUM selected lines
  value: required
  value_name: NUM
- flags:
  - -b
  - --byte-offset
  summary: print the byte offset with output lines
- flags:
  - -n
  - --line-number
  summary: print line number with output lines
- flags:
  - --line-buffered
  summary: flush output on every line
- flags:
  - -H
  - --with-filename
  summary: print file name with output lines
- flags:
  - -h
  - --no-filename
  summary: suppress the file name prefix on output
- flags:
  - --label
  summary: use LABEL as the standard input file name prefix
  value: required
  value_name: LABEL
- flags:
  - -o
  - --only-matching
  summary: show only nonempty parts of lines that match
- flags:
  - -q
  - --quiet
  - --silent
  summary: suppress all normal output
- flags:
  - --binary-files
  summary: assume that binary files are TYPE; TYPE is 'binary', 'text', or 'without-match'
  value: required
  value_name: TYPE
- flags:
  - -a
  - --text
  summary: equivalent to --binary-files=text
- flags:
  - -I
  summary: equivalent to --binary-files=without-match
- flags:
  - -d
  - --directories
  summary: how to handle directories; ACTION is 'read', 'recurse', or 'skip'
  value: required
  value_name: ACTION
- flags:
  - -D
  - --devices
  summary: how to handle devices, FIFOs and sockets; ACTION is 'read' or 'skip'
  value: required
  value_name: ACTION
- flags:
  - -r
  - --recursive
  summary: like --directories=recurse
- flags:
  - -R
  - --dereference-recursive
  summary: likewise, but follow all symlinks
- flags:
  - --include
  summary: search only files that match GLOB (a file pattern)
  value: required
  value_name: GLOB
- flags:
  - --exclude
  summary: skip files that match GLOB
  value: required
  value_name: GLOB
- flags:
  - --exclude-from
  summary: skip files that match any file pattern from FILE
  value: required
  value_name: FILE
- flags:
  - --exclude-dir
  summary: skip directories that match GLOB
  value: required
  value_name: GLOB
- flags:
  - -L
  - --files-without-match
  summary: print only names of FILEs with no selected lines
- flags:
  - -l
  - --files-with-matches
  summary: print only names of FILEs with selected lines
- flags:
  - -c
  - --count
  summary: print only a count of selected lines per FILE
- flags:
  - -T
  - --initial-tab
  summary: make tabs line up (if needed)
- flags:
  - -Z
  - --null
  summary: print 0 byte after FILE name
- flags:
  - -B
  - --before-context
  summary: print NUM lines of leading context
  value: required
  value_name: NUM
- flags:
  - -A
  - --after-context
  summary: print NUM lines of trailing context
  value: required
  value_name: NUM
- flags:
  - -C
  - --context
  summary: print NUM lines of output context
  value: required
  value_name: NUM
- flags:
  - --group-separator
  summary: print SEP on line between matches with context
  value: required
  value_name: SEP
- flags:
  - --no-group-separator
  summary: do not print separator for matches with context
- flags:
  - --color
  summary: (see --help)
  value: optional
  value_name: WHEN
- flags:
  - --colour
  summary: use markers to highlight the matching strings; WHEN is 'always', 'never', or 'auto'
  value: optional
  value_name: WHEN
- flags:
  - -U
  - --binary
  summary: do not strip CR characters at EOL (MSDOS/Windows)
examples:
- cmd: grep -i error app.log
  explain:
  - token: grep
    meaning: ψάξε γραμμές
  - token: -i
    meaning: χωρίς διάκριση πεζών/κεφαλαίων
  - token: error
    meaning: το μοτίβο
  - token: app.log
    meaning: το αρχείο
common_mistakes:
- wrong: grep app.log error
  why: Πρώτα το μοτίβο, μετά το αρχείο.
related:
- id: sort
- id: wc
citations:
- source: gnu-grep
  url: https://www.gnu.org/software/grep/manual/index.html
  doc_version: GNU grep 3.11 (Debian 13)
  last_verified: '2026-10-06'
