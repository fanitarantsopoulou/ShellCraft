# Generated by gen_commands.py. Option summaries are taken verbatim from `sort --help`
# on Debian 13.7 (English); everything else is hand-written.
id: sort
name: sort
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/text
level: intermediate
summary: Ταξινομεί γραμμές κειμένου.
description: Από προεπιλογή ταξινομεί αλφαβητικά, οπότε το 100 έρχεται πριν το 9. Για αριθμούς θέλεις `-n`.
synopsis:
- sort [OPTION]... [FILE]...
- sort [OPTION]... --files0-from=F
flag_grammar: gnu_getopt
options:
- flags:
  - -b
  - --ignore-leading-blanks
  summary: ignore leading blanks
- flags:
  - -d
  - --dictionary-order
  summary: consider only blanks and alphanumeric characters
- flags:
  - -f
  - --ignore-case
  summary: fold lower case to upper case characters
- flags:
  - -g
  - --general-numeric-sort
  summary: compare according to general numerical value
- flags:
  - -i
  - --ignore-nonprinting
  summary: consider only printable characters
- flags:
  - -M
  - --month-sort
  summary: compare (unknown) < 'JAN' < ... < 'DEC'
- flags:
  - -h
  - --human-numeric-sort
  summary: compare human readable numbers (e.g., 2K 1G)
- flags:
  - -n
  - --numeric-sort
  summary: compare according to string numerical value; see full documentation for supported strings
- flags:
  - -R
  - --random-sort
  summary: shuffle, but group identical keys.  See shuf(1)
- flags:
  - --random-source
  summary: get random bytes from FILE
  value: required
  value_name: FILE
- flags:
  - -r
  - --reverse
  summary: reverse the result of comparisons
- flags:
  - --sort
  summary: 'sort according to WORD: general-numeric -g, human-numeric -h, month -M, numeric -n, random -R, version
    -V'
  value: required
  value_name: WORD
- flags:
  - -V
  - --version-sort
  summary: natural sort of (version) numbers within text
- flags:
  - --batch-size
  summary: merge at most NMERGE inputs at once; for more use temp files
  value: required
  value_name: NMERGE
- flags:
  - -c
  - --check
  summary: check for sorted input; do not sort
- flags:
  - -C
  summary: like -c, but do not report first bad line
- flags:
  - --compress-program
  summary: compress temporaries with PROG; decompress them with PROG -d
  value: required
  value_name: PROG
- flags:
  - --debug
  summary: annotate the part of the line used to sort, and warn about questionable usage to stderr
- flags:
  - --files0-from
  summary: read input from the files specified by NUL-terminated names in file F; If F is - then read names from
    standard input
  value: required
  value_name: F
- flags:
  - -k
  - --key
  summary: sort via a key; KEYDEF gives location and type
  value: required
  value_name: KEYDEF
- flags:
  - -m
  - --merge
  summary: merge already sorted files; do not sort
- flags:
  - -o
  - --output
  summary: write result to FILE instead of standard output
  value: required
  value_name: FILE
- flags:
  - -s
  - --stable
  summary: stabilize sort by disabling last-resort comparison
- flags:
  - -S
  - --buffer-size
  summary: use SIZE for main memory buffer
  value: required
  value_name: SIZE
- flags:
  - -t
  - --field-separator
  summary: use SEP instead of non-blank to blank transition
  value: required
  value_name: SEP
- flags:
  - -T
  - --temporary-directory
  summary: use DIR for temporaries, not $TMPDIR or /tmp; multiple options specify multiple directories
  value: required
  value_name: DIR
- flags:
  - --parallel
  summary: change the number of sorts run concurrently to N
  value: required
  value_name: N
- flags:
  - -u
  - --unique
  summary: output only the first of lines with equal keys; with -c, check for strict ordering
- flags:
  - -z
  - --zero-terminated
  summary: line delimiter is NUL, not newline
examples:
- cmd: sort -n sizes.txt
  explain:
  - token: sort
    meaning: ταξινόμησε
  - token: -n
    meaning: αριθμητικά
  - token: sizes.txt
    meaning: το αρχείο
common_mistakes:
- wrong: sort sizes.txt
  why: 'Αλφαβητική ταξινόμηση αριθμών: 10, 100, 9.'
related:
- id: uniq
- id: wc
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
