# Generated by gen_commands.py. Option summaries are taken verbatim from `ls --help`
# on Debian 13.7 (English); everything else is hand-written.
id: ls
name: ls
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/navigation
level: beginner
summary: Δείχνει τα περιεχόμενα φακέλων και πληροφορίες αρχείων.
description: Χωρίς ορίσματα δείχνει τον τρέχοντα φάκελο. Τα αρχεία που ξεκινούν με `.` είναι κρυφά και φαίνονται
  μόνο με `-a`/`-A`.
synopsis:
- ls [OPTION]... [FILE]...
flag_grammar: gnu_getopt
options:
- flags:
  - -a
  - --all
  summary: do not ignore entries starting with .
- flags:
  - -A
  - --almost-all
  summary: do not list implied . and ..
- flags:
  - --author
  summary: with -l, print the author of each file
- flags:
  - -b
  - --escape
  summary: print C-style escapes for nongraphic characters
- flags:
  - --block-size
  summary: with -l, scale sizes by SIZE when printing them; e.g., '--block-size=M'; see SIZE format below
  value: required
  value_name: SIZE
- flags:
  - -B
  - --ignore-backups
  summary: do not list implied entries ending with ~
- flags:
  - -c
  summary: 'with -lt: sort by, and show, ctime (time of last change of file status information); with -l: show ctime
    and sort by name; otherwise: sort by ctime, newest first'
- flags:
  - -C
  summary: list entries by columns
- flags:
  - --color
  summary: color the output WHEN; more info below
  value: optional
  value_name: WHEN
- flags:
  - -d
  - --directory
  summary: list directories themselves, not their contents
- flags:
  - -D
  - --dired
  summary: generate output designed for Emacs' dired mode
- flags:
  - -f
  summary: same as -a -U
- flags:
  - -F
  - --classify
  summary: append indicator (one of */=>@|) to entries WHEN
  value: optional
  value_name: WHEN
- flags:
  - --file-type
  summary: likewise, except do not append '*'
- flags:
  - --format
  summary: across,horizontal (-x), commas (-m), long (-l), single-column (-1), verbose (-l), vertical (-C)
  value: required
  value_name: WORD
- flags:
  - --full-time
  summary: like -l --time-style=full-iso
- flags:
  - -g
  summary: like -l, but do not list owner
- flags:
  - --group-directories-first
  summary: group directories before files
- flags:
  - -G
  - --no-group
  summary: in a long listing, don't print group names
- flags:
  - -h
  - --human-readable
  summary: with -l and -s, print sizes like 1K 234M 2G etc.
- flags:
  - --si
  summary: likewise, but use powers of 1000 not 1024
- flags:
  - -H
  - --dereference-command-line
  summary: follow symbolic links listed on the command line
- flags:
  - --dereference-command-line-symlink-to-dir
  summary: follow each command line symbolic link that points to a directory
- flags:
  - --hide
  summary: do not list implied entries matching shell PATTERN (overridden by -a or -A)
  value: required
  value_name: PATTERN
- flags:
  - --hyperlink
  summary: hyperlink file names WHEN
  value: optional
  value_name: WHEN
- flags:
  - --indicator-style
  summary: 'append indicator with style WORD to entry names: none (default), slash (-p), file-type (--file-type),
    classify (-F)'
  value: required
  value_name: WORD
- flags:
  - -i
  - --inode
  summary: print the index number of each file
- flags:
  - -I
  - --ignore
  summary: do not list implied entries matching shell PATTERN
  value: required
  value_name: PATTERN
- flags:
  - -k
  - --kibibytes
  summary: default to 1024-byte blocks for file system usage; used only with -s and per directory totals
- flags:
  - -l
  summary: use a long listing format
- flags:
  - -L
  - --dereference
  summary: when showing file information for a symbolic link, show information for the file the link references
    rather than for the link itself
- flags:
  - -m
  summary: fill width with a comma separated list of entries
- flags:
  - -n
  - --numeric-uid-gid
  summary: like -l, but list numeric user and group IDs
- flags:
  - -N
  - --literal
  summary: print entry names without quoting
- flags:
  - -o
  summary: like -l, but do not list group information
- flags:
  - -p
  summary: append / indicator to directories
- flags:
  - -q
  - --hide-control-chars
  summary: print ? instead of nongraphic characters
- flags:
  - --show-control-chars
  summary: show nongraphic characters as-is (the default, unless program is 'ls' and output is a terminal)
- flags:
  - -Q
  - --quote-name
  summary: enclose entry names in double quotes
- flags:
  - --quoting-style
  summary: 'use quoting style WORD for entry names: literal, locale, shell, shell-always, shell-escape, shell-escape-always,
    c, escape (overrides QUOTING_STYLE environment variable)'
  value: required
  value_name: WORD
- flags:
  - -r
  - --reverse
  summary: reverse order while sorting
- flags:
  - -R
  - --recursive
  summary: list subdirectories recursively
- flags:
  - -s
  - --size
  summary: print the allocated size of each file, in blocks
- flags:
  - -S
  summary: sort by file size, largest first
- flags:
  - --sort
  summary: 'change default ''name'' sort to WORD: none (-U), size (-S), time (-t), version (-v), extension (-X),
    name, width'
  value: required
  value_name: WORD
- flags:
  - --time
  summary: 'select which timestamp used to display or sort; access time (-u): atime, access, use; metadata change
    time (-c): ctime, status; modified time (default): mtime, modification; birth time: birth, creation; with -l,
    WORD determines which time to show; with --sort=time, sort by WORD (newest first)'
  value: required
  value_name: WORD
- flags:
  - --time-style
  summary: time/date format with -l; see TIME_STYLE below
  value: required
  value_name: TIME_STYLE
- flags:
  - -t
  summary: sort by time, newest first; see --time
- flags:
  - -T
  - --tabsize
  summary: assume tab stops at each COLS instead of 8
  value: required
  value_name: COLS
- flags:
  - -u
  summary: 'with -lt: sort by, and show, access time; with -l: show access time and sort by name; otherwise: sort
    by access time, newest first'
- flags:
  - -U
  summary: do not sort directory entries
- flags:
  - -v
  summary: natural sort of (version) numbers within text
- flags:
  - -w
  - --width
  summary: set output width to COLS.  0 means no limit
  value: required
  value_name: COLS
- flags:
  - -x
  summary: list entries by lines instead of by columns
- flags:
  - -X
  summary: sort alphabetically by entry extension
- flags:
  - -Z
  - --context
  summary: print any security context of each file
- flags:
  - --zero
  summary: end each output line with NUL, not newline
- flags:
  - '-1'
  summary: list one file per line
examples:
- cmd: ls -l
  explain:
  - token: ls
    meaning: λίστα περιεχομένων
  - token: -l
    meaning: 'αναλυτική μορφή: δικαιώματα, ιδιοκτήτης, μέγεθος, ημερομηνία'
- cmd: ls -a
  note: Δείχνει και τα κρυφά αρχεία, μαζί με τα . και ..
common_mistakes:
- wrong: ls -L
  why: Το `-L` ακολουθεί symbolic links· για αναλυτική λίστα θέλεις μικρό `-l`.
related:
- id: cd
- id: pwd
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/ls-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
