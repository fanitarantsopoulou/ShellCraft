# Generated by gen_commands.py. Option summaries are taken verbatim from `chmod --help`
# on Debian 13.7 (English); everything else is hand-written.
id: chmod
name: chmod
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/permissions
level: intermediate
summary: Αλλάζει τα δικαιώματα αρχείων και φακέλων.
description: Δέχεται αριθμητικά modes (`755`) ή συμβολικά (`u+x`, `go-w`). r=4, w=2, x=1 για owner, group, others.
synopsis:
- chmod [OPTION]... MODE[,MODE]... FILE...
- chmod [OPTION]... OCTAL-MODE FILE...
- chmod [OPTION]... --reference=RFILE FILE...
flag_grammar: none
options:
- flags:
  - -c
  - --changes
  summary: like verbose but report only when a change is made
- flags:
  - -f
  - --silent
  - --quiet
  summary: suppress most error messages
- flags:
  - -v
  - --verbose
  summary: output a diagnostic for every file processed
- flags:
  - --dereference
  summary: affect the referent of each symbolic link, rather than the symbolic link itself
- flags:
  - -h
  - --no-dereference
  summary: affect each symbolic link, rather than the referent
- flags:
  - --no-preserve-root
  summary: do not treat '/' specially (the default)
- flags:
  - --preserve-root
  summary: fail to operate recursively on '/'
- flags:
  - --reference
  summary: use RFILE's mode instead of specifying MODE values. RFILE is always dereferenced if a symbolic link.
  value: required
  value_name: RFILE
- flags:
  - -R
  - --recursive
  summary: change files and directories recursively
- flags:
  - -H
  summary: if a command line argument is a symbolic link to a directory, traverse it
- flags:
  - -L
  summary: traverse every symbolic link to a directory encountered
- flags:
  - -P
  summary: do not traverse any symbolic links
examples:
- cmd: chmod 640 report.txt
  explain:
  - token: chmod
    meaning: άλλαξε δικαιώματα
  - token: '640'
    meaning: owner rw- (6), group r-- (4), others --- (0)
  - token: report.txt
    meaning: το αρχείο
- cmd: chmod u+x deploy.sh
  note: Δίνει δικαίωμα εκτέλεσης στον ιδιοκτήτη.
common_mistakes:
- wrong: chmod 777 file
  why: Δίνει σε όλους δικαίωμα εγγραφής — σχεδόν ποτέ δεν είναι η σωστή λύση.
related:
- id: ls
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/chmod-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
