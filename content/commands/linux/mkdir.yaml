# Generated by gen_commands.py. Option summaries are taken verbatim from `mkdir --help`
# on Debian 13.7 (English); everything else is hand-written.
id: mkdir
name: mkdir
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/file-management
level: beginner
summary: Δημιουργεί φακέλους.
description: Με `-p` δημιουργεί και όσους ενδιάμεσους φακέλους λείπουν, και δεν βγάζει σφάλμα αν ο φάκελος υπάρχει
  ήδη.
synopsis:
- mkdir [OPTION]... DIRECTORY...
flag_grammar: gnu_getopt
options:
- flags:
  - -m
  - --mode
  summary: set file mode (as in chmod), not a=rwx - umask
  value: required
  value_name: MODE
- flags:
  - -p
  - --parents
  summary: no error if existing, make parent directories as needed, with their file modes unaffected by any -m option
- flags:
  - -v
  - --verbose
  summary: print a message for each created directory
- flags:
  - -Z
  summary: set SELinux security context of each created directory to the default type
- flags:
  - --context
  summary: like -Z, or if CTX is specified then set the SELinux or SMACK security context to CTX
  value: optional
  value_name: CTX
examples:
- cmd: mkdir -p projects/web/css
  explain:
  - token: mkdir
    meaning: δημιούργησε φάκελο
  - token: -p
    meaning: και τους ενδιάμεσους, χωρίς σφάλμα αν υπάρχουν
  - token: projects/web/css
    meaning: η διαδρομή
common_mistakes:
- wrong: mkdir projects/web/css
  why: 'Αν λείπει το projects/web, αποτυγχάνει: «cannot create directory ...: No such file or directory».'
related:
- id: rmdir
- id: touch
- id: ls
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/mkdir-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
