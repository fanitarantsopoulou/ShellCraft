# Generated by gen_commands.py. Option summaries are taken verbatim from `tail --help`
# on Debian 13.7 (English); everything else is hand-written.
id: tail
name: tail
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/text
level: beginner
summary: 'Δείχνει τις τελευταίες γραμμές ενός αρχείου (προεπιλογή: 10).'
description: 'Με `-f` συνεχίζει να δείχνει νέες γραμμές καθώς γράφονται: ιδανικό για logs.'
synopsis:
- tail [OPTION]... [FILE]...
flag_grammar: gnu_getopt
numeric_shorthand: -n
options:
- flags:
  - -c
  - --bytes
  summary: output the last NUM bytes; or use -c +NUM to output starting with byte NUM of each file
  value: required
  value_name: '[+]NUM'
- flags:
  - -f
  - --follow
  summary: output appended data as the file grows; an absent option argument means 'descriptor'
  value: optional
  value_name: '{name|descriptor}'
- flags:
  - -F
  summary: same as --follow=name --retry
- flags:
  - -n
  - --lines
  summary: output the last NUM lines, instead of the last 10; or use -n +NUM to skip NUM-1 lines at the start
  value: required
  value_name: '[+]NUM'
- flags:
  - --max-unchanged-stats
  summary: with --follow=name, reopen a FILE which has not changed size after N (default 5) iterations to see if
    it has been unlinked or renamed (this is the usual case of rotated log files); with inotify, this option is
    rarely useful
  value: required
  value_name: N
- flags:
  - --pid
  summary: with -f, terminate after process ID, PID dies; can be repeated to watch multiple processes
  value: required
  value_name: PID
- flags:
  - -q
  - --quiet
  - --silent
  summary: never output headers giving file names
- flags:
  - --retry
  summary: keep trying to open a file if it is inaccessible
- flags:
  - -s
  - --sleep-interval
  summary: with -f, sleep for approximately N seconds (default 1.0) between iterations; with inotify and --pid=P,
    check process P at least once every N seconds
  value: required
  value_name: N
- flags:
  - -v
  - --verbose
  summary: always output headers giving file names
- flags:
  - -z
  - --zero-terminated
  summary: line delimiter is NUL, not newline
examples:
- cmd: tail -f /var/log/app.log
  explain:
  - token: tail
    meaning: δείξε το τέλος
  - token: -f
    meaning: και συνέχισε να ακολουθείς νέες γραμμές
  - token: /var/log/app.log
    meaning: το αρχείο
common_mistakes:
- wrong: head -f app.log
  why: Το `head` δεν έχει follow mode· αυτό το κάνει το `tail -f`.
related:
- id: head
- id: cat
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/tail-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
