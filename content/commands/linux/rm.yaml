# Generated by gen_commands.py. Option summaries are taken verbatim from `rm --help`
# on Debian 13.7 (English); everything else is hand-written.
id: rm
name: rm
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/file-management
level: beginner
summary: Διαγράφει αρχεία (και φακέλους με -r).
description: 'Δεν υπάρχει κάδος ανακύκλωσης: ό,τι διαγράφεις με `rm` χάνεται. Για φακέλους χρειάζεται `-r`.'
synopsis:
- rm [OPTION]... [FILE]...
flag_grammar: gnu_getopt
options:
- flags:
  - -f
  - --force
  summary: ignore nonexistent files and arguments, never prompt
- flags:
  - -i
  summary: prompt before every removal
- flags:
  - -I
  summary: prompt once before removing more than three files, or when removing recursively; less intrusive than
    -i, while still giving protection against most mistakes
- flags:
  - --interactive
  summary: 'prompt according to WHEN: never, once (-I), or always (-i); without WHEN, prompt always'
  value: optional
  value_name: WHEN
- flags:
  - --one-file-system
  summary: when removing a hierarchy recursively, skip any directory that is on a file system different from that
    of the corresponding command line argument
- flags:
  - --no-preserve-root
  summary: do not treat '/' specially
- flags:
  - --preserve-root
  summary: do not remove '/' (default); with 'all', reject any command line argument on a separate device from its
    parent
  value: optional
  value_name: all
- flags:
  - -r
  - -R
  - --recursive
  summary: remove directories and their contents recursively
- flags:
  - -d
  - --dir
  summary: remove empty directories
- flags:
  - -v
  - --verbose
  summary: explain what is being done
examples:
- cmd: rm -r build
  explain:
  - token: rm
    meaning: διάγραψε
  - token: -r
    meaning: μαζί με όλο το περιεχόμενο και τους υποφακέλους
  - token: build
    meaning: ο φάκελος
- cmd: rm -i notes.txt
  note: Ρωτάει πριν διαγράψει.
common_mistakes:
- wrong: rm build
  why: 'Για φάκελο χωρίς -r: «rm: cannot remove ''build'': Is a directory».'
when_not_to_use:
- 'Όταν δεν είσαι σίγουρος τι θα ταιριάξει ένα wildcard: δοκίμασε πρώτα με `ls`.'
related:
- id: rmdir
- id: mv
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/rm-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
