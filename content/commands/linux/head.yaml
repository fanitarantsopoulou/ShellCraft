# Generated by gen_commands.py. Option summaries are taken verbatim from `head --help`
# on Debian 13.7 (English); everything else is hand-written.
id: head
name: head
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/text
level: beginner
summary: 'Δείχνει τις πρώτες γραμμές ενός αρχείου (προεπιλογή: 10).'
synopsis:
- head [OPTION]... [FILE]...
flag_grammar: gnu_getopt
numeric_shorthand: -n
options:
- flags:
  - -c
  - --bytes
  summary: print the first NUM bytes of each file; with the leading '-', print all but the last NUM bytes of each
    file
  value: required
  value_name: '[-]NUM'
- flags:
  - -n
  - --lines
  summary: print the first NUM lines instead of the first 10; with the leading '-', print all but the last NUM lines
    of each file
  value: required
  value_name: '[-]NUM'
- flags:
  - -q
  - --quiet
  - --silent
  summary: never print headers giving file names
- flags:
  - -v
  - --verbose
  summary: always print headers giving file names
- flags:
  - -z
  - --zero-terminated
  summary: line delimiter is NUL, not newline
examples:
- cmd: head -n 3 app.log
  explain:
  - token: head
    meaning: δείξε την αρχή
  - token: -n 3
    meaning: τις 3 πρώτες γραμμές
  - token: app.log
    meaning: το αρχείο
common_mistakes:
- wrong: tail -n 3 app.log
  why: Το `tail` δείχνει το τέλος, όχι την αρχή.
related:
- id: tail
- id: cat
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/head-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
