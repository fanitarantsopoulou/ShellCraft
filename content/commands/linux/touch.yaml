# Generated by gen_commands.py. Option summaries are taken verbatim from `touch --help`
# on Debian 13.7 (English); everything else is hand-written.
id: touch
name: touch
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/file-management
level: beginner
summary: Δημιουργεί κενό αρχείο ή ενημερώνει την ώρα τροποποίησης.
description: Αν το αρχείο υπάρχει, δεν αλλάζει το περιεχόμενό του — μόνο τους χρόνους πρόσβασης/τροποποίησης.
synopsis:
- touch [OPTION]... FILE...
flag_grammar: gnu_getopt
options:
- flags:
  - -a
  summary: change only the access time
- flags:
  - -c
  - --no-create
  summary: do not create any files
- flags:
  - -d
  - --date
  summary: parse STRING and use it instead of current time
  value: required
  value_name: STRING
- flags:
  - -f
  summary: (ignored)
- flags:
  - -h
  - --no-dereference
  summary: affect each symbolic link instead of any referenced file (useful only on systems that can change the
    timestamps of a symlink)
- flags:
  - -m
  summary: change only the modification time
- flags:
  - -r
  - --reference
  summary: use this file's times instead of current time
  value: required
  value_name: FILE
- flags:
  - --time
  summary: 'specify which time to change: access time (-a): ''access'', ''atime'', ''use''; modification time (-m):
    ''modify'', ''mtime'''
  value: required
  value_name: WORD
examples:
- cmd: touch notes.txt
  explain:
  - token: touch
    meaning: δημιούργησε ή «άγγιξε» αρχείο
  - token: notes.txt
    meaning: το αρχείο
common_mistakes:
- wrong: touch notes
  why: Δημιουργεί αρχείο, όχι φάκελο — για φάκελο θέλεις `mkdir`.
related:
- id: mkdir
- id: cat
citations:
- source: gnu-coreutils
  url: https://www.gnu.org/software/coreutils/manual/html_node/touch-invocation.html
  doc_version: GNU coreutils 9.7 (Debian 13)
  last_verified: '2026-10-06'
