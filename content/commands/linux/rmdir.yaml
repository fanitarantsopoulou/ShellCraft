id: rmdir
name: rmdir
kind: external_utility
provider: GNU coreutils
platform: debian-13
category: linux/file-management
level: beginner
summary: Διαγράφει άδειους φακέλους.
description: 'Αποτυγχάνει αν ο φάκελος έχει περιεχόμενο: αυτό είναι χαρακτηριστικό ασφαλείας, όχι πρόβλημα.'
synopsis:
