  summary: ignore each failure to remove a non-empty directory
- flags:
  - -p
  - --parents
  summary: remove DIRECTORY and its ancestors; e.g., 'rmdir -p a/b' is similar to 'rmdir a/b a'
- flags:
  - -v
  - --verbose
  summary: output a diagnostic for every directory processed
examples:
