examples:
- cmd: docker run -d -p 8080:80 --name web nginx
  explain:
  - token: docker run
    meaning: δημιούργησε και ξεκίνα container
  - token: -d
    meaning: στο παρασκήνιο (detached)
  - token: -p 8080:80
    meaning: θύρα 8080 του host → θύρα 80 του container
  - token: --name web
    meaning: όνομα του container
  - token: nginx
    meaning: το image
common_mistakes:
- wrong: docker run nginx -d
  why: Το `-d` μετά το image περνάει στο container ως όρισμα· το docker δεν το βλέπει.
- wrong: docker run -p 80:8080 nginx
  why: Η σειρά είναι HOST:CONTAINER. Το nginx ακούει στη 80 μέσα στο container.
