[project]
name = "linux-learning"
version = "0.1.0"
description = "Interactive learning platform for Linux, networking, containers and cloud."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140,<1",
    "uvicorn[standard]>=0.50,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pyyaml>=6,<7",
    "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "httpx>=0.28,<1",
    "hypothesis>=6,<7",
    "ruff>=0.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: tests that need a PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # learner-facing strings are Greek; Greek letters are not "ambiguous" here
    "RUF012",  # mutable defaults on Pydantic models are copied per instance (indirect BaseModel subclasses)
]
